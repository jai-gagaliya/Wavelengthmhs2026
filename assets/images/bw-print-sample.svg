<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <rect width="500" height="500" fill="#ffffff"/>
  <rect x="16" y="16" width="468" height="468" fill="none" stroke="#111111" stroke-width="2"/>
  <!-- Engraved / Hatching Style Scientific Illustration -->
  <g stroke="#111111" stroke-width="1.4" stroke-linecap="round">
    <circle cx="250" cy="240" r="110" fill="none" stroke-width="2"/>
    <circle cx="250" cy="240" r="80" fill="none" stroke-dasharray="2 4"/>
    <circle cx="250" cy="240" r="50" fill="none" stroke-width="1.8"/>
    <ellipse cx="250" cy="240" rx="150" ry="65" fill="none" stroke-width="1.8" transform="rotate(-30 250 240)"/>
    <ellipse cx="250" cy="240" rx="150" ry="65" fill="none" stroke-width="1.2" transform="rotate(30 250 240)"/>
    <circle cx="250" cy="240" r="18" fill="#111111"/>
    <!-- Radiating measurement ticks -->
    <line x1="250" y1="100" x2="250" y2="120" stroke-width="2"/>
    <line x1="250" y1="360" x2="250" y2="380" stroke-width="2"/>
    <line x1="110" y1="240" x2="130" y2="240" stroke-width="2"/>
    <line x1="370" y1="240" x2="390" y2="240" stroke-width="2"/>
  </g>
  <text x="250" y="430" font-family="Georgia, serif" font-size="13" fill="#111111" text-anchor="middle" letter-spacing="0.15em" font-style="italic">
    ARTICLE 01 — CHROMATIC FLUX RESONATOR
  </text>
  <text x="250" y="450" font-family="monospace" font-size="9" fill="#555555" text-anchor="middle" letter-spacing="0.2em">
    PRINTED EDITION · SCAN WITH WAVELENGTH AR
  </text>
</svg>